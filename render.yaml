# Separate Keystatic editor; the public site stays on GitHub Pages.
services:
    - type: web
      name: teamvan-editor
      runtime: node
      plan: free
      repo: https://github.com/frcvan/teamvan.org
      branch: main
      buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:editor
      startCommand: pnpm start:editor
      healthCheckPath: /keystatic/
      envVars:
          - key: NODE_VERSION
            value: 22
          - key: HOST
            value: 0.0.0.0
          - key: KEYSTATIC_GITHUB_CLIENT_ID
            sync: false
          - key: KEYSTATIC_GITHUB_CLIENT_SECRET
            sync: false
          - key: KEYSTATIC_SECRET
            sync: false
          - key: PUBLIC_KEYSTATIC_GITHUB_APP_SLUG
            sync: false
